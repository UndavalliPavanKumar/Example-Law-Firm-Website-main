version: '3.9'

services:
  db:
    image: postgres:15
    container_name: lawfirm-db
    environment:
      POSTGRES_USER: lawfirm
      POSTGRES_PASSWORD: lawfirm
      POSTGRES_DB: lawfirmdb
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lawfirm-backend
    env_file:
      - ./backend/.env.example
    ports:
      - '8000:8000'
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://lawfirm:lawfirm@db:5432/lawfirmdb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lawfirm-frontend
    ports:
      - '4173:4173'
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8000/api/v1

volumes:
  db_data:
